<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6CC6FF"/>
      <stop offset="0.5" stop-color="#2E86F2"/>
      <stop offset="1" stop-color="#1A5FD4"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.22" cy="0.1" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyFront" x1="0.2" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#C9ECFF"/>
      <stop offset="0.55" stop-color="#E9F7FF"/>
      <stop offset="1" stop-color="#F8FCFF"/>
    </linearGradient>
    <linearGradient id="skyBack" x1="0.2" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#B7E3FF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <linearGradient id="skyGlass" x1="0.2" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#D5F1FF"/>
      <stop offset="1" stop-color="#FBFEFF"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#82B0E6"/>
      <stop offset="1" stop-color="#3E71B7"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48C8F5"/>
      <stop offset="1" stop-color="#1C9FDB"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#63D79A"/>
      <stop offset="1" stop-color="#2EB06A"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <clipPath id="backClip">
      <rect x="-199" y="-164" width="398" height="328" rx="10"/>
    </clipPath>
    <clipPath id="frontClip">
      <rect x="-224" y="-184" width="448" height="368" rx="12"/>
    </clipPath>
    <clipPath id="glassClip">
      <circle cx="0" cy="0" r="120"/>
    </clipPath>
  </defs>

  <!-- app background -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#gloss)"/>

  <!-- back photo card -->
  <g transform="translate(560 430) rotate(-7)">
    <rect x="-225" y="-190" width="450" height="380" rx="18" fill="#08234F" fill-opacity="0.20" transform="translate(0 18)"/>
    <rect x="-225" y="-190" width="450" height="380" rx="18" fill="#FFFFFF"/>
    <g clip-path="url(#backClip)">
      <rect x="-199" y="-164" width="398" height="328" rx="10" fill="url(#skyBack)"/>
      <circle cx="-128" cy="-118" r="42" fill="#FFE899" fill-opacity="0.45"/>
      <circle cx="-128" cy="-118" r="28" fill="#FFD05A"/>
      <path d="M-199 62 C-140 12 -80 72 -20 32 C40 -8 110 62 199 22 L199 164 L-199 164 Z" fill="#A8D5F0"/>
      <path d="M-199 164 L-199 98 C-150 62 -90 112 -30 88 C40 62 120 112 199 90 L199 164 Z" fill="url(#hill)"/>
    </g>
  </g>

  <!-- front photo card -->
  <g transform="translate(470 556) rotate(6)">
    <rect x="-250" y="-210" width="500" height="420" rx="18" fill="#08234F" fill-opacity="0.22" transform="translate(0 18)"/>
    <rect x="-250" y="-210" width="500" height="420" rx="18" fill="#FFFFFF"/>
    <g clip-path="url(#frontClip)">
      <rect x="-224" y="-184" width="448" height="368" rx="12" fill="url(#skyFront)"/>

      <!-- sun -->
      <circle cx="-152" cy="-112" r="56" fill="#FFE899" fill-opacity="0.45"/>
      <circle cx="-152" cy="-112" r="38" fill="#FFC531"/>

      <!-- clouds -->
      <ellipse cx="-70" cy="-158" rx="40" ry="15" fill="#FFFFFF" fill-opacity="0.85"/>
      <ellipse cx="-105" cy="-150" rx="22" ry="10" fill="#FFFFFF" fill-opacity="0.85"/>
      <ellipse cx="-42" cy="-150" rx="20" ry="9" fill="#FFFFFF" fill-opacity="0.85"/>

      <!-- distant range -->
      <path d="M-224 34 L-160 -46 L-70 26 L10 -52 L100 22 L176 -28 L224 14 L224 92 L-224 92 Z" fill="#A6C9EE"/>

      <!-- main mountain -->
      <path d="M-224 92 L-150 30 L-95 65 L-20 -88 L55 40 L120 5 L224 60 L224 92 Z" fill="url(#mount)"/>
      <path d="M-20 -88 L30 -8 L8 -20 L-6 -4 L-22 -18 L-42 -8 Z" fill="#FFFFFF"/>

      <!-- lake -->
      <rect x="-224" y="88" width="448" height="52" fill="url(#lakeGrad)"/>
      <rect x="-224" y="96" width="448" height="7" fill="#9BE7FA" fill-opacity="0.75"/>
      <rect x="-224" y="110" width="448" height="5" fill="#9BE7FA" fill-opacity="0.5"/>

      <!-- foreground hill -->
      <path d="M-224 184 L-224 132 C-170 104 -110 152 -50 128 C10 104 90 146 224 124 L224 184 Z" fill="url(#hill)"/>
    </g>
  </g>

  <!-- magnifier shadow -->
  <circle cx="638" cy="438" r="152" fill="#08234F" fill-opacity="0.20"/>
  <path d="M746 529 L883 653" stroke="#08234F" stroke-opacity="0.20" stroke-width="64" stroke-linecap="round" fill="none"/>

  <!-- magnifier handle -->
  <path d="M742 521 L879 645" stroke="#123A6E" stroke-width="64" stroke-linecap="round" fill="none"/>
  <path d="M750 512 L887 636" stroke="#2E5F9F" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- magnifier ring -->
  <circle cx="634" cy="424" r="152" fill="url(#ringGrad)" stroke="#C6DDF5" stroke-width="3"/>

  <!-- magnifier glass -->
  <g transform="translate(634 424)">
    <g clip-path="url(#glassClip)">
      <rect x="-120" y="-120" width="240" height="240" fill="url(#skyGlass)"/>
      <path d="M-120 120 L-78 46 L-30 -84 L22 26 L72 -18 L120 52 L120 120 Z" fill="url(#mount)"/>
      <path d="M-30 -84 L16 -4 L-4 -14 L-18 4 L-38 -14 L-56 -2 Z" fill="#FFFFFF"/>
      <rect x="-120" y="58" width="240" height="62" fill="url(#lakeGrad)"/>
      <rect x="-120" y="68" width="240" height="7" fill="#9BE7FA" fill-opacity="0.7"/>
      <path d="M-120 -30 L-60 -120 L-20 -120 L-90 20 Z" fill="#FFFFFF" fill-opacity="0.10"/>
      <path d="M-96 -62 A 114 114 0 0 1 -34 -112" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="26" fill="none"/>
    </g>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#DCEBFA" stroke-width="3"/>
  </g>
</svg>
