name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            # windows-latest 可能已切到 VS2026（v180 工具集），而 electron-magickwand
            # 的 binding.gyp 固定要求 v143，因此这里固定在 VS2022 镜像上。
            os: windows-2022
            args: --win nsis
            artifact: windows
            files: |
              dist/*.exe
              dist/*.exe.blockmap
          - name: macOS
            # macos-latest ships Xcode 26 / Apple clang 21, which the Conan
            # version bundled with electron-magickwand does not know.
            # macos-15 keeps Xcode 16.x (clang <= 17), which is supported.
            os: macos-15
            args: --mac
            artifact: macos
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
            artifact: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    env:
      # Releases are not signed yet; don't let electron-builder try to find a
      # macOS certificate on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Write Conan MSVC profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # electron-magickwand builds ImageMagick through Conan. Instead of
          # relying on Conan's compiler auto-detection (which picks up MinGW
          # GCC on the runner), pin the default profile to the MSVC toolchain.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          # Prefer VS 2022 (17.x); Conan's MesonToolchain knows that IDE version.
          # Fall back to the newest installation if 17.x is not present.
          $vsVersion = & $vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $vsInstallPath = & $vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsVersion) {
            $vsVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
            $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if (-not $vsVersion) { throw 'Visual Studio C++ toolchain not found' }
          $vsMajor = [int]($vsVersion.Split('.')[0])
          $msvcVersion = switch ($vsMajor) {
            14 { '190' }
            15 { '191' }
            16 { '192' }
            17 { '193' }
            18 { '194' }
            default { '193' }
          }
          $profileDir = Join-Path $env:LOCALAPPDATA 'hadron\profiles'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          $profileLines = @(
            '[settings]'
            'os=Windows'
            'arch=x86_64'
            'build_type=Release'
            'compiler=msvc'
            "compiler.version=$msvcVersion"
            'compiler.runtime=static'
            'compiler.runtime_type=Release'
            'compiler.cppstd=20'
            '[conf]'
            "tools.microsoft.msbuild:vs_version=$vsMajor"
            "tools.microsoft.msbuild:installation_path=$($vsInstallPath -replace '\\', '/')"
          )
          $profileFile = Join-Path $profileDir 'default'
          [System.IO.File]::WriteAllText($profileFile, ($profileLines -join "`r`n") + "`r`n")
          Get-Content $profileFile

      - name: Use Conan-compatible Xcode
        if: runner.os == 'macOS'
        run: |
          # Prefer an Xcode 16.x toolchain (Apple clang <= 17). Fall back to the
          # runner default if it is not installed.
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Rebuild magickwand for Electron
        if: runner.os == 'Windows'
        run: npm run rebuild:native

      - name: Build renderer and main process
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
