name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win nsis
            artifact: windows
            files: |
              dist/*.exe
              dist/*.exe.blockmap
          - name: macOS
            # macos-latest now ships Xcode 26 / Apple clang 21, which the
            # Conan version bundled with electron-magickwand does not know.
            # macos-14 keeps an older clang that is supported.
            os: macos-14
            args: --mac
            artifact: macos
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
            artifact: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    env:
      # Releases are not signed yet; don't let electron-builder try to find a
      # macOS certificate on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove non-MSVC compilers from PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # electron-magickwand builds ImageMagick through Conan. The runner
          # ships MinGW / Strawberry GCC in PATH, which makes Conan detect gcc
          # instead of MSVC and fail on compiler.runtime. Drop every PATH entry
          # that exposes gcc/clang, keeping the MSVC toolchain set up above.
          $filtered = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) -and -not (Test-Path (Join-Path $_ 'clang.exe'))
          }) -join ';'
          "PATH=$filtered" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
